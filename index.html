<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSC ID Records & Photo QC Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto bg-white shadow-lg rounded-xl p-6">
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row justify-between items-center border-b pb-4 mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">CSC ID Records & Photo QC Portal</h1>
                <p class="text-sm text-gray-500">Manage records, check details, and review branding photos quickly.</p>
            </div>
            <div>
                <!-- Updated Button Text -->
                <button onclick="loadQCData()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2.5 rounded-lg shadow transition flex items-center gap-2">
                    🔄 Fetch & Verify QC Records
                </button>
            </div>
        </div>

        <!-- Search & Filter Bar -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Search Record</label>
                <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search by CSC ID, Name, District..." class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Filter by Status</label>
                <select id="statusFilter" onchange="filterTable()" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">All Statuses</option>
                    <option value="Approved">Approved</option>
                    <option value="Pending">Pending</option>
                    <option value="Rejected">Rejected</option>
                </select>
            </div>
            <div class="flex items-end">
                <span id="recordCount" class="text-xs font-semibold text-gray-500 bg-gray-100 px-3 py-2 rounded-lg w-full text-center">Total Records: 0</span>
            </div>
        </div>

        <!-- Data Table Section -->
        <div class="overflow-x-auto border border-gray-200 rounded-lg">
            <table class="w-full border-collapse text-left text-sm text-gray-700">
                <thead class="bg-gray-50 text-gray-700 uppercase text-xs tracking-wider">
                    <tr>
                        <th class="border border-gray-300 px-3 py-3 text-center">S.No</th>
                        <th class="border border-gray-300 px-3 py-3">CSC ID</th>
                        <th class="border border-gray-300 px-3 py-3">VLE Name</th>
                        <th class="border border-gray-300 px-3 py-3">District</th>
                        <th class="border border-gray-300 px-3 py-3">Location</th>
                        <th class="border border-gray-300 px-3 py-3 text-center">Branding Photo</th>
                        <th class="border border-gray-300 px-3 py-3 text-center">Status</th>
                    </tr>
                </thead>
                <tbody id="qc-table-body">
                    <tr>
                        <td colspan="7" class="text-center py-6 text-gray-400 italic">Click on 'Fetch & Verify QC Records' to load data.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- IMAGE PREVIEW MODAL (Lightbox) -->
    <div id="image-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 hidden" onclick="closeImageModal()">
        <div class="relative max-w-3xl max-h-screen p-2" onclick="event.stopPropagation()">
            <button onclick="closeImageModal()" class="absolute -top-4 -right-4 bg-red-600 text-white font-bold rounded-full w-8 h-8 flex items-center justify-center shadow-lg hover:bg-red-700 text-sm">✕</button>
            <img id="modal-img-tag" src="" alt="Large Preview" class="max-w-full max-h-[85vh] rounded-lg shadow-2xl border-2 border-white object-contain">
        </div>
    </div>

    <!-- Script Section -->
    <script>
        // Sample mock data for testing or hook it up with your Code.gs google.script.run API
        let allRecords = [
            { id: 1, cscId: "123456780011", name: "Rahul Verma", district: "Raipur", location: "Main Road, Near Chowk", photoLink: "https://via.placeholder.com/150", status: "Pending" },
            { id: 2, cscId: "123456780022", name: "Amit Sahu", district: "Durg", location: "Bus Stand Market", photoLink: "https://via.placeholder.com/150", status: "Approved" }
        ];

        function loadQCData() {
            // Yahan aap google.script.run.withSuccessHandler(...).getData() laga sakte hain
            // Abhi ke liye sample data render kar rahe hain
            renderTable(allRecords);
        }

        function renderTable(data) {
            let tbody = document.getElementById('qc-table-body');
            document.getElementById('recordCount').innerText = `Total Records: ${data.length}`;

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-gray-400 italic">No records found.</td></tr>`;
                return;
            }

            let html = '';
            data.forEach((c, index) => {
                html += `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="border border-gray-300 px-3 py-3 text-center font-medium text-gray-500">${index + 1}</td>
                        <td class="border border-gray-300 px-3 py-3 font-mono text-xs">${c.cscId}</td>
                        <td class="border border-gray-300 px-3 py-3 font-semibold">${c.name}</td>
                        <td class="border border-gray-300 px-3 py-3">${c.district}</td>
                        <td class="border border-gray-300 px-3 py-3">${c.location}</td>
                        <td class="border border-gray-300 px-3 py-3 text-center">
                            ${c.photoLink ? `
                                <div class="flex flex-col items-center gap-1">
                                    <img src="${c.photoLink}" alt="Branding" class="w-14 h-14 object-cover rounded shadow cursor-pointer hover:opacity-80 transition border border-gray-300" onclick="openImageModal('${c.photoLink}')" title="Click to preview">
                                    <a href="${c.photoLink}" target="_blank" class="text-blue-600 hover:underline text-[10px] font-semibold">🔗 Open Full</a>
                                </div>
                            ` : '<span class="text-gray-400 text-xs">No Photo</span>'}
                        </td>
                        <td class="border border-gray-300 px-3 py-3 text-center">
                            <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${c.status === 'Approved' ? 'bg-green-100 text-green-700' : c.status === 'Rejected' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700'}">
                                ${c.status}
                            </span>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function filterTable() {
            let search = document.getElementById('searchInput').value.toLowerCase();
            let status = document.getElementById('statusFilter').value;

            let filtered = allRecords.filter(c => {
                let matchesSearch = c.cscId.toLowerCase().includes(search) || 
                                    c.name.toLowerCase().includes(search) || 
                                    c.district.toLowerCase().includes(search) || 
                                    c.location.toLowerCase().includes(search);
                let matchesStatus = status === "" || c.status === status;
                return matchesSearch && matchesStatus;
            });

            renderTable(filtered);
        }

        // Modal Functions for Image Preview
        function openImageModal(url) {
            let modal = document.getElementById('image-modal');
            let imgTag = document.getElementById('modal-img-tag');
            imgTag.src = url;
            modal.classList.remove('hidden');
        }

        function closeImageModal() {
            let modal = document.getElementById('image-modal');
            modal.classList.add('hidden');
            document.getElementById('modal-img-tag').src = "";
        }
    </script>
</body>
</html>
