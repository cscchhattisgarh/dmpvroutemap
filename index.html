<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DM Field Verification & Route Planner</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">🗺️ DM Field Visit & Route Planner</h1>
            <span id="total-badge" class="bg-blue-700 text-xs px-3 py-1 rounded-full font-semibold">Loading...</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        
        <!-- Filter Section -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-col sm:flex-row gap-4 items-center justify-between">
            <div class="w-full sm:w-1/3">
                <label class="block text-sm font-medium text-gray-700 mb-1">District Select Karein:</label>
                <input type="text" id="district-input" placeholder="jaise: Raipur, Bilaspur..." 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div class="w-full sm:w-auto flex items-end">
                <button onclick="fetchData()" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2 rounded-lg transition">
                    Load Route Plan
                </button>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loader" class="text-center py-12 hidden">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent"></div>
            <p class="text-gray-500 mt-2">Data fetch ho raha hai, kripya pratiksha karein...</p>
        </div>

        <!-- Days Plan Container -->
        <div id="days-container" class="space-y-8">
            <!-- Dynamic Days and Tables will load here -->
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        // Yahan apna Apps Script ka Web App URL daalein
        const API_URL = "https://script.google.com/macros/s/AKfycbzVdBzb6h7yPHiF-gPlmQ725xmsttfD7HV2MEFpoLvtV93-wTkOR1_zxovEseKvyDu9/exec";

        async function fetchData() {
            const district = document.getElementById('district-input').value.trim();
            const loader = document.getElementById('loader');
            const container = document.getElementById('days-container');
            const badge = document.getElementById('total-badge');

            loader.classList.remove('hidden');
            container.innerHTML = "";

            try {
                let url = API_URL;
                if (district) {
                    url += `?district=${encodeURIComponent(district)}`;
                }

                let response = await fetch(url);
                let result = await response.json();

                loader.classList.add('hidden');

                if (result.success) {
                    badge.innerText = `Total Centers: ${result.totalCenters}`;
                    
                    if (result.daysPlan.length === 0) {
                        container.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-gray-500 shadow-sm">Koi record nahi mila.</div>`;
                        return;
                    }

                    result.daysPlan.forEach(day => {
                        let tableRows = day.centers.map((c, index) => `
                            <tr class="hover:bg-gray-50 border-b">
                                <td class="px-4 py-3 text-sm text-gray-700">${index + 1}</td>
                                <td class="px-4 py-3 text-sm font-medium text-gray-900">${c.block}</td>
                                <td class="px-4 py-3 text-sm text-gray-600">${c.cscId}</td>
                                <td class="px-4 py-3 text-sm font-semibold text-gray-800">${c.vleName}</td>
                                <td class="px-4 py-3 text-sm text-gray-600">${c.mobileNo}</td>
                                <td class="px-4 py-3 text-sm">
                                    ${c.photoLink ? `<a href="${c.photoLink}" target="_blank" class="text-blue-600 hover:underline font-medium">View Photo</a>` : '<span class="text-gray-400">No Photo</span>'}
                                </td>
                                <td class="px-4 py-3 text-sm">
                                    ${c.lat && c.lon ? `<a href="https://www.google.com/maps?q=${c.lat},${c.lon}" target="_blank" class="bg-emerald-100 text-emerald-800 px-2 py-1 rounded text-xs font-semibold hover:bg-emerald-200">📍 Open Map</a>` : 'N/A'}
                                </td>
                            </tr>
                        `).join('');

                        let dayCard = `
                            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                                <div class="bg-gray-100 px-6 py-4 flex flex-col sm:flex-row justify-between items-center border-b gap-4">
                                    <div>
                                        <h2 class="text-lg font-bold text-gray-800">📅 Day ${day.dayNumber} Route Plan</h2>
                                        <p class="text-xs text-gray-500">Is din ke liye total ${day.centers.length} VLE centers scheduled hain.</p>
                                    </div>
                                    <a href="${day.routeUrl}" target="_blank" class="bg-green-600 hover:bg-green-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow transition flex items-center gap-2">
                                        🗺️ Start Day ${day.dayNumber} Route Map
                                    </a>
                                </div>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left border-collapse">
                                        <thead>
                                            <tr class="bg-gray-50 text-gray-600 uppercase text-xs tracking-wider border-b">
                                                <th class="px-4 py-3">#</th>
                                                <th class="px-4 py-3">Block</th>
                                                <th class="px-4 py-3">CSC ID</th>
                                                <th class="px-4 py-3">VLE Name</th>
                                                <th class="px-4 py-3">Mobile</th>
                                                <th class="px-4 py-3">Photo</th>
                                                <th class="px-4 py-3">Location</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${tableRows}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        `;
                        container.innerHTML += dayCard;
                    });
                } else {
                    alert('Data load karne mein kuch samasya aayi.');
                }
            } catch (error) {
                loader.classList.add('hidden');
                console.error(error);
                alert('Connection error! Kripya apna URL check karein.');
            }
        }

        // Page load hote hi saara data load karne ke liye
        window.onload = () => fetchData();
    </script>
</body>
</html>
