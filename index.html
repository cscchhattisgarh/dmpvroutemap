<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSC Smart Route Planner</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-route"></i> CSC Route Planner
            </h1>
            <span id="current-district-badge" class="text-xs bg-indigo-700 px-3 py-1 rounded-full font-medium">Ready</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 flex flex-col gap-6">

        <!-- Controls Card -->
        <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex flex-col gap-4">
            <h2 class="text-lg font-semibold text-slate-700">Location & Selection</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- District Selection -->
                <div>
                    <label for="district-select" class="block text-sm font-medium text-slate-600 mb-1">Select District</label>
                    <select id="district-select" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">-- Choose District --</option>
                        <option value="Raipur">Raipur</option>
                        <option value="Durg">Durg</option>
                        <option value="Bilaspur">Bilaspur</option>
                        <option value="Bastar">Bastar</option>
                        <option value="Korba">Korba</option>
                    </select>
                </div>

                <!-- Location Source Mode -->
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Starting Point Location</label>
                    <div class="flex gap-2">
                        <button id="btn-gps" onclick="getLocation()" class="flex-1 bg-indigo-50 text-indigo-700 border border-indigo-200 py-2.5 px-3 rounded-lg text-sm font-medium hover:bg-indigo-100 transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-location-crosshairs"></i> Use GPS
                        </button>
                        <button id="btn-manual" onclick="toggleManualInput()" class="bg-slate-100 text-slate-700 border border-slate-300 py-2.5 px-3 rounded-lg text-sm font-medium hover:bg-slate-200 transition">
                            Manual
                        </button>
                    </div>
                </div>
            </div>

            <!-- Manual Lat/Lon Inputs (Hidden by default) -->
            <div id="manual-coords-container" class="hidden grid grid-cols-2 gap-4 pt-2 border-t border-slate-100">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Latitude</label>
                    <input type="text" id="manual-lat" placeholder="e.g. 21.2514" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Longitude</label>
                    <input type="text" id="manual-lon" placeholder="e.g. 81.6296" class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                </div>
            </div>

            <!-- Fetch Button -->
            <button onclick="fetchRouteData()" class="w-full bg-indigo-600 text-white font-medium py-3 rounded-lg hover:bg-indigo-700 transition shadow-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-calculator"></i> Generate Optimized Route
            </button>
        </section>

        <!-- Route Results Section -->
        <section id="results-section" class="hidden flex flex-col gap-4">
            <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                <h3 id="list-title" class="font-bold text-slate-700">Optimized Route</h3>
                <div class="flex gap-2">
                    <a id="route-part-1" href="#" target="_blank" class="hidden text-xs bg-emerald-600 text-white px-3 py-2 rounded-lg font-medium hover:bg-emerald-700 transition flex items-center gap-1">
                        <i class="fa-solid fa-map-location-dot"></i> Route Part 1
                    </a>
                    <a id="route-part-2" href="#" target="_blank" class="hidden text-xs bg-blue-600 text-white px-3 py-2 rounded-lg font-medium hover:bg-blue-700 transition flex items-center gap-1">
                        <i class="fa-solid fa-map-location-dot"></i> Route Part 2
                    </a>
                </div>
            </div>

            <!-- Centers List container -->
            <div id="centers-container" class="flex flex-col gap-3">
                <!-- Dynamic cards will load here -->
            </div>
        </section>

        <!-- Loader -->
        <div id="loader" class="hidden flex flex-col items-center justify-center py-10 gap-3">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600"></div>
            <p class="text-sm text-slate-500 font-medium">Calculating shortest route sequence...</p>
        </div>

    </main>

    <!-- Script Logic -->
    <script>
        // Yahan apni Web App ki published URL daal dein
        const API_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE"; 

        let userLat = null;
        let userLon = null;

        function getLocation() {
            if (navigator.geolocation) {
                document.getElementById('current-district-badge').innerText = "Locating...";
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLat = position.coords.latitude;
                        userLon = position.coords.longitude;
                        document.getElementById('current-district-badge').innerText = "GPS Fixed ✓";
                        alert("Location captured successfully!");
                    },
                    (error) => {
                        alert("GPS Error: " + error.message + ". Please use Manual coordinates.");
                        document.getElementById('current-district-badge').innerText = "GPS Failed";
                    }
                );
            } else {
                alert("Geolocation is not supported by this browser.");
            }
        }

        function toggleManualInput() {
            const container = document.getElementById('manual-coords-container');
            container.classList.toggle('hidden');
        }

        function fetchRouteData() {
            const district = document.getElementById('district-select').value;
            if (!district) {
                alert("Please select a district first.");
                return;
            }

            // Check manual coords if visible
            const manualContainer = document.getElementById('manual-coords-container');
            if (!manualContainer.classList.contains('hidden')) {
                userLat = document.getElementById('manual-lat').value;
                userLon = document.getElementById('manual-lon').value;
            }

            if (!userLat || !userLon) {
                alert("Please provide location via GPS or Manual inputs.");
                return;
            }

            // Show loader
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('results-section').classList.add('hidden');

            // Zaroori Fix: action=dmRoute joda gaya hai taaki backend sahi function trigger kare
            let url = `${API_URL}?action=dmRoute&district=${encodeURIComponent(district)}&lat=${userLat}&lon=${userLon}&limit=100`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loader').classList.add('hidden');
                    if(data.status === "success") {
                        renderResults(district, data.route);
                    } else {
                        alert("Error from server: " + (data.message || "Unknown error"));
                    }
                })
                .catch(error => {
                    document.getElementById('loader').classList.add('hidden');
                    console.error('Fetch error:', error);
                    alert("Failed to fetch route data. Check console for details.");
                });
        }

        function renderResults(district, routeList) {
            document.getElementById('results-section').classList.remove('hidden');
            
            // Fix: proper property assignment for title update
            document.getElementById('list-title').innerText = `${district.toUpperCase()} - Smart Sequential Route (${routeList.length} Centers)`;

            const container = document.getElementById('centers-container');
            container.innerHTML = '';

            routeList.forEach((item, index) => {
                let card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between";
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-8 h-8 rounded-full bg-indigo-50 text-indigo-600 font-bold flex items-center justify-center text-sm">${index + 1}</span>
                        <div>
                            <h4 class="font-semibold text-slate-800 text-sm">${item.name || 'Center Name'}</h4>
                            <p class="text-xs text-slate-500">ID: ${item.cscId || 'N/A'} • Dist: ${item.distance ? item.distance.toFixed(2) : 0} km</p>
                        </div>
                    </div>
                    <a href="https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lon}" target="_blank" class="text-slate-400 hover:text-indigo-600 p-2">
                        <i class="fa-solid fa-diamond-turn-right text-lg"></i>
                    </a>
                `;
                container.appendChild(card);
            });

            // Handle Maps Route Links generation logic here if available
        }
    </script>
</body>
</html>
